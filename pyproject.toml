[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-online-learning"
version = "0.2.0"
description = "Constant-step Elo simulations and chronological ATP forecast evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jingyi (Joy) Zhang" }]
license = { file = "LICENSE" }
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "xlrd>=2.0",
]

[tool.setuptools.packages.find]
include = ["elo_online*"]
