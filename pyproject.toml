[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-online-learning"
version = "0.1.0"
description = "Elo as constant-step SGD: invariant fluctuations, adaptation, and prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jingyi Zhang" }]
license = { file = "LICENSE" }
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["elo_online*"]
